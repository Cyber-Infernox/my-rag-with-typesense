[project]
name = "my-rag-from-scratch"
version = "0.1.0"
description = "A hands-on project to understand and implement Retrieval-Augmented Generation (RAG) from scratch using Python."
readme = "README.md"
authors = [
    { name = "Cyber_Infernox", email = "sayonkar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "numpy>=1.26",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "typesense>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
